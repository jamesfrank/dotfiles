# colours
PRIMARY_BG_COLOUR='colour33' # other: 67

# highlight current window
set-window-option -g window-status-current-style fg=white,bg=colour24
set-window-option -g window-status-current-format ' #I·#W ' # default: '#I:#W#F'

# regular window options
set-window-option -g window-status-format ' #I·#W ' # default: '#I:#W#F'

# change status bar colour
set -g status-bg $PRIMARY_BG_COLOUR
set -g status-fg black

# define status bar glyphs
LEFT_GLYPH=''
RIGHT_GLYPH=''

# define status bar colours
BG_GREY='#[bg=colour59]'
FG_GREY='#[fg=colour59]'
BG_LGREY='#[bg=colour244]'
FG_LGREY='#[fg=colour244]'
FG_WHITE='#[fg=white]'
BG_WHITE='#[bg=white]'
FG_BLACK='#[fg=black]'
BG_BLUE="#[bg=$PRIMARY_BG_COLOUR]"

# define status bar commands
UPTIME='#(uptime | cut -d "," -f 3- | cut -d ":" -f2 | sed -e "s/^[ \t]*//")'

# put stuff in status bar
# #h - short hostname   #H - full hostname
# #S - session name
# #I - window number
# #P - pane number
set-option -g status-left "$BG_WHITE #h $BG_BLUE$FG_WHITE$LEFT_GLYPH"
set-option -g status-right "$BG_BLUE$FG_GREY$RIGHT_GLYPH$BG_GREY$FG_BLACK $UPTIME $BG_GREY$FG_WHITE$RIGHT_GLYPH$BG_WHITE$FG_BLACK %A, %B %d "

# allow window number swapping
bind-key -n C-S-Left swap-window -t -1
bind-key -n C-S-Right swap-window -t +1

# define another prefix key - useful for dealing with nested tmux sessions
set-option -g prefix2 C-a

# pane movement
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

# pane resize (repeatable; mouse-free, works the same on macOS and Linux)
bind -r H resize-pane -L 5
bind -r J resize-pane -D 5
bind -r K resize-pane -U 5
bind -r L resize-pane -R 5

# reload config without killing server
bind R source-file ~/.tmux.conf \; display-message "Config reloaded..."

# set correct term
set -g default-terminal tmux-256color
# 24-bit truecolor passthrough so vim colorschemes render correctly
set -ga terminal-features ",*:RGB"

# kill the ~500ms delay after Escape (noticeable entering vim normal mode)
set -sg escape-time 10
# let vim/programs detect terminal focus (autoread, cursor restore, etc.)
set -g focus-events on

# set vi keys
setw -g mode-keys vi
unbind [
bind Escape copy-mode
unbind p
bind p paste-buffer
# vim-style selection in copy mode (copy-mode-vi table, tmux 2.4+)
bind-key -T copy-mode-vi 'v' send-keys -X begin-selection

# Clipboard strategy: on macOS, pipe the selection straight to pbcopy — rock-solid
# locally and never dependent on the terminal's OSC-52 support (the cause of the
# "sometimes it copies, often it doesn't" flakiness). The pipe also fills the tmux
# buffer, so set-clipboard's OSC-52 (below) still fires for SSH/Linux where pbcopy
# isn't present. Non-macOS falls back to plain OSC-52.
#   y (keyboard)       : copy + exit copy-mode (vim idiom)
#   mouse drag-release : copy but KEEP the highlight visible (press q or click to exit)
if-shell 'command -v pbcopy >/dev/null 2>&1' {
  bind-key -T copy-mode-vi 'y' send-keys -X copy-pipe-and-cancel 'pbcopy'
  bind-key -T copy-mode-vi MouseDragEnd1Pane send-keys -X copy-pipe-no-clear 'pbcopy'
} {
  bind-key -T copy-mode-vi 'y' send-keys -X copy-selection-and-cancel
  bind-key -T copy-mode-vi MouseDragEnd1Pane send-keys -X copy-selection-no-clear
}

# OSC-52 clipboard writes (portable macOS/Linux; works over SSH). On macOS this is
# a backup to the pbcopy pipe above; on Linux/over-SSH it's the primary path.
# Requires the terminal to permit OSC-52, or it silently no-ops:
#   - iTerm2: enabled by default
#   - Terminal.app: Edit > "Allow terminal apps to access clipboard"
#   - over SSH: the *local* terminal must allow it (OSC-52 passes through tmux)
set -g set-clipboard on

# cycle through windows using ctrl-j/k
bind-key -n C-k next
bind-key -n C-j prev

# allow window number swapping with ctrl-alt-j/k
bind-key -n C-M-j swap-window -t -1
bind-key -n C-M-k swap-window -t +1

# scrollback buffer n lines
set -g history-limit 5000

# start window indexing at one instead of zero
set -g base-index 1
# panes start at 1 too, matching windows
set -g pane-base-index 1
# renumber windows when one is closed so numbering stays gap-free
set -g renumber-windows on

# mouse: drag pane borders to resize (also enables click-select and wheel scrollback)
# note on macOS: hold Option (⌥) while dragging for native terminal text selection
set -g mouse on

bind '"' split-window -c "#{pane_current_path}"
bind % split-window -h -c "#{pane_current_path}"
bind c new-window -c "#{pane_current_path}"
